<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東京鐵塔 3D 城市探索與自由飛行：柯基傑洛 (Corgi Zero)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background-color: #060a12;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            color: #fff;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        
        /* 齒輪收合按鈕 (手機版專用) */
        #toggle-panel-btn {
            display: none;
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 100;
            background: rgba(8, 15, 28, 0.9);
            border: 1px solid #ff5533;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        #ui-panel {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(8, 15, 28, 0.88);
            border: 1px solid rgba(255, 85, 51, 0.65);
            border-left: 5px solid #ff3b14;
            border-radius: 8px;
            padding: 14px 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
            max-width: 360px;
            z-index: 90;
            pointer-events: auto;
            max-height: 90vh;
            overflow-y: auto;
        }
        #ui-panel h1 {
            font-size: 16px;
            color: #ff5533;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        #ui-panel .subtitle {
            font-size: 11px;
            color: #9cb3c9;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            padding-bottom: 6px;
        }
        .control-list {
            list-style: none;
            font-size: 12px;
            line-height: 1.6;
        }
        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 0px 5px;
            font-family: monospace;
            font-weight: bold;
            color: #44ff99;
            margin-right: 3px;
        }
        .key-fly {
            color: #33ddff;
            border-color: #33ddff;
            background: rgba(0, 180, 255, 0.18);
        }
        #hud-right {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(8, 15, 28, 0.88);
            border: 1px solid rgba(0, 230, 180, 0.55);
            border-right: 5px solid #00e5ff;
            border-radius: 8px;
            padding: 10px 14px;
            backdrop-filter: blur(8px);
            min-width: 170px;
            text-align: right;
            z-index: 80;
            pointer-events: none;
        }
        .altitude-val {
            font-size: 24px;
            font-weight: 800;
            color: #00e5ff;
            font-family: monospace;
        }
        .zone-badge {
            display: inline-block;
            margin-top: 3px;
            padding: 2px 8px;
            background: rgba(255, 68, 0, 0.25);
            border: 1px solid #ff5522;
            border-radius: 12px;
            font-size: 11px;
            color: #ffaa88;
        }
        .btn-group {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11.5px;
            transition: all 0.2s;
            flex: 1 1 auto;
            text-align: center;
        }
        .btn:hover {
            background: rgba(255, 85, 51, 0.45);
            border-color: #ff5533;
        }
        .btn.active {
            background: #ff4411;
            border-color: #ff8866;
            font-weight: bold;
        }
        .btn-fly.active {
            background: #0088cc;
            border-color: #33ddff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }
        #action-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 15, 28, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 30px;
            padding: 5px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(6px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            white-space: nowrap;
            z-index: 70;
            pointer-events: none;
        }
        .status-pill {
            font-size: 11.5px;
            color: #aaddff;
        }
        .status-pill span {
            color: #00ff99;
            font-weight: bold;
        }

        /* 虛擬觸控操作介面 (手機專用) */
        #mobile-controls {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 60;
        }

            pointer-events: auto;
